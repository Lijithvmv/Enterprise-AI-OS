<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b14"/>
      <stop offset="0.55" stop-color="#0a1320"/>
      <stop offset="1" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="build" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="ctrl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12233d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.6"/>
  <circle cx="1030" cy="312" r="370" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#acc)"/>

  <!-- right motif: OS tile grid of nodes -->
  <g transform="translate(902,150)">
    <g stroke="#1b3350" stroke-width="1.5">
      <line x1="55" y1="55" x2="165" y2="55"/><line x1="165" y1="55" x2="275" y2="55"/>
      <line x1="55" y1="55" x2="55" y2="165"/><line x1="165" y1="55" x2="165" y2="165"/><line x1="275" y1="55" x2="275" y2="165"/>
      <line x1="55" y1="165" x2="165" y2="165"/><line x1="165" y1="165" x2="275" y2="165"/>
      <line x1="55" y1="165" x2="55" y2="275"/><line x1="165" y1="165" x2="165" y2="275"/><line x1="275" y1="165" x2="275" y2="275"/>
      <line x1="55" y1="275" x2="165" y2="275"/><line x1="165" y1="275" x2="275" y2="275"/>
    </g>
    <g>
      <circle cx="55" cy="55" r="12" fill="#0b1626" stroke="url(#build)" stroke-width="3"/>
      <circle cx="165" cy="55" r="12" fill="#0b1626" stroke="url(#build)" stroke-width="3"/>
      <circle cx="275" cy="55" r="12" fill="#0b1626" stroke="url(#build)" stroke-width="3"/>
      <circle cx="55" cy="165" r="12" fill="#0b1626" stroke="url(#build)" stroke-width="3"/>
      <circle cx="165" cy="165" r="16" fill="#0b1626" stroke="url(#acc)" stroke-width="4"/>
      <circle cx="275" cy="165" r="12" fill="#0b1626" stroke="url(#ctrl)" stroke-width="3"/>
      <circle cx="55" cy="275" r="12" fill="#0b1626" stroke="url(#ctrl)" stroke-width="3"/>
      <circle cx="165" cy="275" r="12" fill="#0b1626" stroke="url(#ctrl)" stroke-width="3"/>
      <circle cx="275" cy="275" r="12" fill="#0b1626" stroke="url(#ctrl)" stroke-width="3"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(96,142)">
    <rect x="0" y="-34" width="250" height="30" rx="6" fill="#0c1728" stroke="#1b3350"/>
    <text x="16" y="-13" font-size="15" letter-spacing="2" font-weight="600" fill="#38bdf8">AWESOME · CURATED MAP</text>

    <text x="0" y="76" font-size="82" font-weight="800" fill="#eef6ff" letter-spacing="-1">Enterprise AI OS</text>
    <text x="2" y="126" font-size="27" font-weight="600" fill="#bcd7f5">The operating system for enterprise AI —</text>
    <text x="2" y="160" font-size="27" font-weight="600" fill="#bcd7f5">build it, run it, and keep it under control.</text>

    <!-- two pillars -->
    <g transform="translate(0,204)">
      <rect x="0" y="0" width="330" height="86" rx="12" fill="#0b1524" stroke="#164066"/>
      <text x="20" y="30" font-size="16" font-weight="700" letter-spacing="1" fill="#22d3ee">BUILD · the agentic stack</text>
      <text x="20" y="58" font-size="15" fill="#8fb6d9">LLMs · agents · orchestration</text>
      <text x="20" y="78" font-size="15" fill="#8fb6d9">MCP / A2A / AG-UI · memory · graphs</text>

      <rect x="350" y="0" width="330" height="86" rx="12" fill="#0f0f24" stroke="#3a2f6b"/>
      <text x="370" y="30" font-size="16" font-weight="700" letter-spacing="1" fill="#a78bfa">CONTROL · the trust plane</text>
      <text x="370" y="58" font-size="15" fill="#b3a6e0">identity · access · guardrails</text>
      <text x="370" y="78" font-size="15" fill="#b3a6e0">gateways · observability · governance</text>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(96,600)" font-size="17" fill="#5b7fa6">
    <text x="0" y="0">github.com/Lijithvmv/Enterprise-AI-OS</text>
    <text x="1088" y="0" text-anchor="end" fill="#4a6b90">For the era of increasingly autonomous AI</text>
  </g>
</svg>
